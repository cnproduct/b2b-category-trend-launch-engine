<div class="product-b2b-card" data-cat="{{CATEGORY_SLUG}}" data-is-trend="1" data-item-no="{{PRODUCT_SKU}}">
  <div class="product-card-thumb">
    <span class="product-card-badge" style="background:#dc2626; color:#ffffff;">🔥 2026 TOP TRENDING BREAKOUT</span>
    <span class="product-card-sku">{{PRODUCT_SKU}}</span>
    <a href="/products/{{CLEAN_SLUG}}" style="display:block;">
      <img alt="{{PRODUCT_TITLE}}" loading="lazy" src="{{HERO_IMAGE_URL}}"/>
    </a>
  </div>
  <div class="product-card-body">
    <div class="product-card-category" style="color:#2563eb; font-weight:700;">{{CATEGORY_NAME}}</div>
    <h4 class="product-card-title" title="{{PRODUCT_TITLE}}">
      <a href="/products/{{CLEAN_SLUG}}" style="color:#0f172a; text-decoration:none;">{{PRODUCT_SHORT_TITLE}}</a>
    </h4>
    <div class="product-spec-row"><span class="product-spec-label">Key Specs:</span><span class="product-spec-val">{{KEY_FEATURE}}</span></div>
    <div class="product-spec-row"><span class="product-spec-label">Material:</span><span class="product-spec-val">{{PRIMARY_MATERIAL}}</span></div>
    <div class="product-spec-row"><span class="product-spec-label">Safety:</span><span class="product-spec-val" style="color:#16a34a; font-weight:700;">{{PRIMARY_CERTIFICATION}}</span></div>
    <div class="product-spec-row"><span class="product-spec-label">FOB Price:</span><span class="product-spec-val" style="color:#2563eb; font-weight:800;">{{FOB_PRICE_STRING}}</span></div>
    <div class="product-card-actions">
      <a href="/products/{{CLEAN_SLUG}}" class="btn-card-quote" style="background:#2563eb; color:#fff; text-decoration:none; text-align:center; padding:8px 12px; border-radius:6px; font-weight:700; display:inline-block; width:100%;">
        View Details &amp; RFQ &rarr;
      </a>
    </div>
  </div>
</div>
